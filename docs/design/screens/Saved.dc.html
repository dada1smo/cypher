<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cypher — History and saved</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&amp;display=swap">
<style>
body{margin:0}
[style*="Fraunces"]{font-variation-settings:"SOFT" 100}
a{color:#B45309;text-decoration:none}a:hover{color:#92400E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF9; color: #16181D; font-family: Archivo, system-ui, sans-serif; padding: 0; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 56px 20px 20px; display: flex; flex-direction: column; gap: 16px">
<nav style="display: flex; align-items: center; justify-content: space-between; margin: 0 -12px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Back</a>
<button style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #B45309; font: inherit; font-size: 16px; cursor: pointer">Edit</button>
</nav>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 600">Your words</h1>
<div role="tablist" aria-label="List" style="display: flex; gap: 4px; padding: 4px; background: #EFEFF1; border-radius: 12px">
<sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="2">
<button role="tab" aria-selected="{{ tab.selected }}" onClick="{{ tab.pick }}" style="{{ tab.style }}">{{ tab.label }}</button>
</sc-for>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<li style="border-bottom: 1px solid #E4E4E7">
<a href="Entry.dc.html" style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0; color: #16181D">
<span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-family: Fraunces, Georgia, serif; font-size: 20px">{{ r.word }}</span><span style="font-size: 12px; color: #5B606B">{{ r.meta }}</span></span>
<span style="font-size: 14px; color: #5B606B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.gloss }}</span>
</a>
</li>
</sc-for>
</ul>
</div>
<dc-import name="Footer" hint-size="390px,64px"></dc-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { tab: 'saved' }; }
renderVals() {
const lists = {
saved: [
{ word: 'cipher', meta: 'noun, verb', gloss: 'A method of transforming a text in order to conceal its meaning.' },
{ word: 'liminal', meta: 'adjective', gloss: 'Of or relating to a threshold or transition.' },
{ word: 'quixotic', meta: 'adjective', gloss: 'Possessing or acting with the desire to do noble deeds, unrealistically.' },
],
history: [
{ word: 'cipher', meta: 'Today', gloss: 'A method of transforming a text in order to conceal its meaning.' },
{ word: 'sonder', meta: 'Today', gloss: 'The realization that every passerby has a life as complex as one’s own.' },
{ word: 'quixotic', meta: 'Yesterday', gloss: 'Possessing or acting with the desire to do noble deeds, unrealistically.' },
{ word: 'liminal', meta: 'Mon', gloss: 'Of or relating to a threshold or transition.' },
{ word: 'ersatz', meta: 'Mon', gloss: 'Made in imitation; artificial, especially of an inferior quality.' },
],
};
const tab = this.state.tab;
const tabs = [['saved', 'Saved'], ['history', 'History']].map(([k, label]) => {
const on = k === tab;
return {
label, selected: on ? 'true' : 'false', pick: () => this.setState({ tab: k }),
style: 'flex: 1; min-height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; '
+ (on ? 'background: #FFFFFF; color: #16181D; box-shadow: 0 1px 2px rgba(0,0,0,0.12)' : 'background: transparent; color: #5B606B'),
};
});
return { tabs, rows: lists[tab] };
}
}
</script>
</body>
</html>
