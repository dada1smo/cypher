<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cypher — Home with language switch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&amp;display=swap">
<style>
body{margin:0}
[style*="Fraunces"]{font-variation-settings:"SOFT" 100}
a{color:#B45309;text-decoration:none}a:hover{color:#92400E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF9; color: #16181D; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
<div style="flex-grow: 1; padding: 64px 20px 20px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: -0.5px">Cypher</h1>
<button aria-haspopup="menu" aria-expanded="{{ menuOpenAttr }}" aria-label="Dictionary language: {{ current.name }}" onClick="{{ toggleMenu }}" style="min-height: 44px; padding: 0 12px 0 14px; border: 0; border-radius: 22px; background: #FEF3C7; color: #92400E; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
<span style="font-size: 12px; letter-spacing: 0.6px; padding: 2px 5px; border-radius: 5px; background: #FDE68A">{{ current.code }}</span>{{ current.native }}
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<a href="Search.dc.html" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #FFFFFF; border: 1.5px solid #D97706; border-radius: 14px; color: #5B606B; font-size: 17px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span>{{ current.placeholder }}</span>
</a>
<div style="flex-grow: 1"></div>
<a href="Entry.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; background: #FEF3C7; font-size: 15px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1"></circle><circle cx="15.5" cy="15.5" r="1"></circle><circle cx="15.5" cy="8.5" r="1"></circle><circle cx="8.5" cy="15.5" r="1"></circle></svg>
Random word
</a>
</div>
<dc-import name="Footer" hint-size="390px,64px"></dc-import>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<button aria-label="Close menu" onClick="{{ closeMenu }}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(17,19,23,0.12); cursor: default"></button>
<div role="menu" aria-label="Dictionary language" style="position: absolute; top: 116px; right: 20px; width: 250px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 12px 32px rgba(17,19,23,0.18), 0 0 0 1px rgba(17,19,23,0.06); padding: 6px 0; display: flex; flex-direction: column">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="2">
<button role="menuitemradio" aria-checked="{{ l.checkedAttr }}" onClick="{{ l.pick }}" style="min-height: 48px; padding: 0 14px; border: 0; background: transparent; font: inherit; color: #16181D; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<span style="width: 18px; color: #B45309; display: flex"><sc-if value="{{ l.checked }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 500">{{ l.native }}</span><span style="font-size: 12px; color: #5B606B">{{ l.name }}</span></span>
</button>
</sc-for>
<div style="height: 1px; background: #E4E4E7; margin: 6px 0"></div>
<a href="Languages.dc.html" role="menuitem" style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: #16181D">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Manage languages…</a>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menuOpen":{"editor":"boolean","default":false},"lang":{"editor":"enum","options":["en","fr"],"default":"en"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: null, lang: null }; }
renderVals() {
const all = [
{ id: 'en', code: 'EN', native: 'English', name: 'English', placeholder: 'Search an English word' },
{ id: 'fr', code: 'FR', native: 'Français', name: 'French', placeholder: 'Search a French word' },
];
const lang = this.state.lang ?? this.props.lang ?? 'en';
const menuOpen = this.state.open ?? this.props.menuOpen ?? false;
const current = all.find((l) => l.id === lang) || all[0];
return {
current, menuOpen, menuOpenAttr: menuOpen ? 'true' : 'false',
toggleMenu: () => this.setState({ open: !menuOpen }),
closeMenu: () => this.setState({ open: false }),
langs: all.map((l) => ({ ...l, checked: l.id === lang, checkedAttr: l.id === lang ? 'true' : 'false', pick: () => this.setState({ lang: l.id, open: false }) })),
};
}
}
</script>
</body>
</html>
