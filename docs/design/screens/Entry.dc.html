<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cypher — Entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&amp;display=swap">
<style>
body{margin:0}
[style*="Fraunces"]{font-variation-settings:"SOFT" 100}
a{color:#B45309;text-decoration:none}a:hover{color:#92400E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: {{ t.bg }}; color: {{ t.ink }}; font-family: Archivo, system-ui, sans-serif; padding: 56px 0 0; display: flex; flex-direction: column; overflow: hidden">
<nav style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<a href="Search.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; font-size: 16px; color: {{ t.accent }}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Search</a>
<div style="display: flex">
<button aria-label="Save word" onClick="{{ toggleSaved }}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{ t.accent }}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{ savedFill }}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>
<button aria-label="Share" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{ t.accent }}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></button>
</div>
</nav>
<div style="flex-grow: 1; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 44px; font-weight: 600; letter-spacing: -0.8px">{{ word }}</h1>
<p style="margin: 0; font-size: 16px; color: {{ t.muted }}"><sc-if value="{{ single }}" hint-placeholder-val="{{ false }}"><span style="font-family: Fraunces, Georgia, serif; font-style: italic; color: {{ t.ink }}">{{ posLabel }}</span> · </sc-if>{{ ipa }}</p>
</header>
<sc-if value="{{ multi }}" hint-placeholder-val="{{ true }}">
<div role="tablist" aria-label="Part of speech" style="display: flex; gap: 4px; padding: 4px; background: {{ t.surface }}; border-radius: 12px">
<sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="2">
<button role="tab" aria-selected="{{ tab.selected }}" onClick="{{ tab.pick }}" style="{{ tab.style }}">{{ tab.label }}</button>
</sc-for>
</div>
</sc-if>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 16px">
<sc-for list="{{ senses }}" as="s" hint-placeholder-count="3">
<li style="display: flex; gap: 12px">
<span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; background: {{ t.surface }}; color: {{ t.muted }}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-top: 2px">{{ s.n }}</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 18px; line-height: 1.45"><sc-for list="{{ s.parts }}" as="part" hint-placeholder-count="1"><sc-if value="{{ part.link }}" hint-placeholder-val="{{ false }}"><a href="EntryNoun.dc.html" style="color: {{ t.accent }}; text-decoration: none">{{ part.text }}</a></sc-if><sc-if value="{{ part.plain }}" hint-placeholder-val="{{ true }}"><span>{{ part.text }}</span></sc-if></sc-for></p>
<sc-if value="{{ s.example }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 15px; line-height: 1.45; font-style: italic; color: {{ t.muted }}">“{{ s.example }}”</p>
</sc-if>
</div>
</li>
</sc-for>
</ol>
<section style="border-top: 1px solid {{ t.line }}; padding-top: 4px">
<button aria-expanded="{{ etymOpen }}" onClick="{{ toggleEtym }}" style="width: 100%; min-height: 48px; border: 0; background: transparent; color: {{ t.ink }}; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">Etymology<span style="color: {{ t.muted }}; font-weight: 400">{{ etymSign }}</span></button>
<sc-if value="{{ etymOpen }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0 0 8px; font-size: 15px; line-height: 1.5; color: {{ t.muted }}">{{ etym }}</p>
</sc-if>
</section>
</div>
<dc-import name="Footer" dark="{{ dark }}" hint-size="390px,64px"></dc-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"word":{"editor":"enum","options":["cipher","serendipity"],"default":"cipher"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { pos: 'noun', saved: false, etymOpen: false }; }
renderVals() {
const dark = this.props.dark ?? false;
const t = dark
? { bg: '#111317', ink: '#ECEDEF', muted: '#A3A7B0', surface: '#1E2128', line: '#2A2E36', accent: '#FBBF24', tabOn: '#2C3140' }
: { bg: '#FAFAF9', ink: '#16181D', muted: '#5B606B', surface: '#EFEFF1', line: '#E4E4E7', accent: '#B45309', tabOn: '#FFFFFF' };
const entries = {
cipher: { ipa: '/ˈsaɪfə/ UK · /ˈsaɪfɚ/ US', etym: 'From Middle English siphre, from Old French cifre, from Medieval Latin cifra, from Arabic ṣifr (“zero, empty”).', pos: {
noun: [
{ gloss: 'A method of [transforming] a text in order to [conceal] its meaning.', example: 'The message was written in a simple substitution cipher.' },
{ gloss: 'A [numeric] character; in particular, [zero].', example: '' },
{ gloss: 'A person of no importance; a [nonentity].', example: 'He was a mere cipher in the administration.' },
],
verb: [
{ gloss: 'To [calculate]; to do [arithmetic].', example: '' },
{ gloss: 'To [encode] a message using a cipher.', example: 'They ciphered every letter before sending it.' },
],
} },
serendipity: { ipa: '/ˌsɛɹənˈdɪpɪti/', etym: 'Coined by Horace Walpole in 1754, after the Persian fairy tale The Three Princes of Serendip, whose heroes kept making discoveries by accident.', pos: {
noun: [
{ gloss: 'An [unsought], [unintended], and unexpected but [fortunate] discovery made by accident.', example: 'Finding that book in a stranger’s house was pure serendipity.' },
{ gloss: 'The [faculty] of making such fortunate discoveries.', example: '' },
],
} },
};
const word = entries[this.props.word] ? this.props.word : 'cipher';
const data = entries[word].pos;
const keys = Object.keys(data);
const pos = data[this.state.pos] ? this.state.pos : keys[0];
const cap = (k) => k[0].toUpperCase() + k.slice(1);
const tabs = keys.map((k) => {
const on = k === pos;
return {
label: cap(k) + ' · ' + data[k].length, selected: on ? 'true' : 'false',
pick: () => this.setState({ pos: k }),
style: 'flex: 1; min-height: 40px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; '
+ (on ? 'background: ' + t.tabOn + '; color: ' + t.ink + '; box-shadow: 0 1px 2px rgba(0,0,0,0.12)' : 'background: transparent; color: ' + t.muted),
};
});
return {
t, tabs, dark, word, ipa: entries[word].ipa, etym: entries[word].etym,
multi: keys.length > 1, single: keys.length === 1, posLabel: keys[0],
// [word] in a gloss marks a link (kaikki: senses[].links)
senses: data[pos].map((s, i) => ({ ...s, n: i + 1, parts: s.gloss.split(/(\[[^\]]+\])/).filter(Boolean).map((x) => { const link = x[0] === '['; return { text: link ? x.slice(1, -1) : x, link, plain: !link }; }) })),
savedFill: this.state.saved ? 'currentColor' : 'none',
toggleSaved: () => this.setState({ saved: !this.state.saved }),
etymOpen: this.state.etymOpen,
etymSign: this.state.etymOpen ? 'Hide' : 'Show',
toggleEtym: () => this.setState({ etymOpen: !this.state.etymOpen }),
};
}
}
</script>
</body>
</html>
