<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cypher — Search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&amp;display=swap">
<style>
body{margin:0}
[style*="Fraunces"]{font-variation-settings:"SOFT" 100}
a{color:#B45309;text-decoration:none}a:hover{color:#92400E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF9; color: #16181D; font-family: Archivo, system-ui, sans-serif; padding: 60px 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 20px 12px">
<label for="q" style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 16px; background: #FFFFFF; border: 1.5px solid #D97706; border-radius: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="q" value="ciph" aria-label="Search" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: #16181D">
<a href="Main.dc.html" aria-label="Clear search" style="width: 44px; height: 44px; margin-right: -6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 32px; height: 32px; border-radius: 16px; background: #E4E4E7; color: #5B606B; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></span></a>
</label>
</div>
<p style="margin: 0; padding: 4px 20px 8px; font-size: 13px; color: #5B606B">6 words start with “ciph”</p>
<ul style="list-style: none; margin: 0; padding: 0 20px; display: flex; flex-direction: column">
<sc-for list="{{ results }}" as="r" hint-placeholder-count="6">
<li style="border-bottom: 1px solid #E4E4E7">
<a href="Entry.dc.html" style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0; color: #16181D">
<span style="display: flex; align-items: baseline; gap: 10px"><span style="font-family: Fraunces, Georgia, serif; font-size: 20px"><b style="font-weight: 600">{{ r.head }}</b>{{ r.tail }}</span><span style="font-size: 12px; color: #5B606B">{{ r.pos }}</span></span>
<span style="font-size: 14px; line-height: 1.4; color: #5B606B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.gloss }}</span>
</a>
</li>
</sc-for>
</ul>
<div style="flex-grow: 1"></div>
<dc-import name="Footer" hint-size="390px,64px"></dc-import>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 291px; background: #D1D3D9; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4A4E57">iOS keyboard</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
['cipher', 'noun · verb', 'A method of transforming a text in order to conceal its meaning.'],
['ciphers', 'noun', 'plural of cipher'],
['ciphered', 'verb', 'simple past and past participle of cipher'],
['ciphering', 'verb', 'present participle of cipher'],
['ciphertext', 'noun', 'Text that has been encrypted.'],
['cipherer', 'noun', 'One who ciphers.'],
];
return { results: rows.map(([w, pos, gloss]) => ({ head: w.slice(0, 4), tail: w.slice(4), pos, gloss })) };
}
}
</script>
</body>
</html>
